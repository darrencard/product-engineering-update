[project]
name = "product-engineering-update"
version = "0.1.0"
description = "A skill that builds a product and engineering update deck from a team's own data."
requires-python = ">=3.9"
# Standard library only, on purpose: the scripts run inside sandboxes that cannot install packages.
dependencies = []

[tool.ruff]
line-length = 160
target-version = "py39"

[tool.ruff.lint]
# E, F: errors and unused names. I: import order. B: likely bugs. UP: syntax older than Python 3.9.
# SIM: needless complexity. S: security (bandit).
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# The fixture generator draws synthetic rows with random; nothing it makes is a secret or a token.
"evals/**" = ["S311"]
